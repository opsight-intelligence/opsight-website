# Pull-request checks for the site: build it and check the result — every
# internal link resolves, every indexed page has a title, description and
# canonical — without fetching anything external. Runs on PRs only; the push
# to main is built by pages.yml, and a stats push costs no minutes here either.
name: checks

on:
  pull_request:
    paths-ignore:
      - 'stats.json'
      - 'procurement-stats.json'
      - 'procurement-figures.json'
      - 'agent-demo.json'

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sitemap lastmod comes from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build   # prebuild: sitemap; postbuild: check-dist

  security:
    # The org's dependency gate: Trivy over package-lock.json, failing only on
    # fixable CRITICAL/HIGH. Same parameters as python-ci-reusable.yml uses
    # for the engines; here the lockfile is the frozen install.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: package-lock.json
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
