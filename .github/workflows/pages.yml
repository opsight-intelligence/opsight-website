# Build the Astro site and publish it to GitHub Pages.
#
# Triggers on source changes on main AND on the nightly figures push
# (opsight-fraud scripts/deploy_website_stats.py writes stats.json,
# procurement-*.json and agent-demo.json at the repo root). The build copies
# those files into the site (scripts/figures.mjs) and the pages fetch them
# from their own origin, so a figures push must rebuild for the numbers to
# move. Docs-only changes still skip the build.
name: pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'VERSION'
      - 'CHANGELOG.md'
      - 'website.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # sitemap lastmod comes from git history
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Fetch the newest 22.x each run: a runner once served a cached 22.23.3, below
          # the 22.23.4 that Astro 7.4 requires, and the build failed before it began.
          check-latest: true
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # dist/.well-known/security.txt is a dot-folder, which the action
          # leaves out of the artifact unless told otherwise.
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
