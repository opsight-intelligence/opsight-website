<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Redirect stub. The procurement page lived here until 2026-08-10, when the
     URL was renamed to match the product. Any link already shared points here.

     GitHub Pages serves static files and cannot issue a real 301, so this is
     the closest honest equivalent: rel=canonical hands the ranking signal to
     /procurement, the meta refresh moves a human immediately, and the script
     uses location.replace so the stub does not sit in the back-button history.
     Keep this file. Deleting it turns every link shared before the rename into
     a 404. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://opsightintel.com/procurement">
<meta http-equiv="refresh" content="0; url=/procurement">
<title>Redirecting to Opsight Procurement Intelligence</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:#f8f9fa;color:#212529;display:flex;align-items:center;
  justify-content:center;min-height:100vh;margin:0;text-align:center;padding:24px}
a{color:#1f7a8c}
</style>
<script>location.replace('/procurement');</script>
</head>
<body>
<p>This page has moved to <a href="/procurement">opsightintel.com/procurement</a>.</p>
</body>
</html>
