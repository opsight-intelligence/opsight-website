<!-- Redirect stub. The fraud page lived here until 2026-09-15, when it was
     migrated to Astro and the URL renamed to say what the page is: /fraud

     points here. GitHub Pages cannot issue a real 301, so rel=canonical hands
     the ranking signal on, the meta refresh moves a human immediately, and

     file: deleting it turns every link shared before the rename into a 404. -->
